name: C build and smoke test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile bank transaction analyzer
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror projects/transactions.c -o /tmp/transactions
      - name: Run example data
        run: /tmp/transactions projects/sample_transactions.csv
